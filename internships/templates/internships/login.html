{% extends "internships/base.html" %}
{% block title %}Войти{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="form-card">
        <h2 class="h4 fw-bold text-center mb-4">Вход в аккаунт</h2>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary w-100 btn-lg">Войти</button>
        </form>
        <p class="text-center mt-3 text-muted">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
